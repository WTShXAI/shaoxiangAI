[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shaoxiang-ai"
version = "6.0.0"
description = "ShaoxiangAI — World Cup 2026 football prediction system"
requires-python = ">=3.10"
dependencies = [
    # 核心数据 & 计算
    "numpy>=1.24",
    "pandas>=1.5",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",

    # 数据库
    "sqlalchemy>=2.0",
    "duckdb>=0.8",

    # ML 模型
    "lightgbm>=4.0",
    "xgboost>=1.7",

    # 网络 & API
    "requests>=2.28",
    "aiohttp>=3.9",
    "websockets>=12.0",
    "httpx>=0.24",

    # Web 服务
    "fastapi>=0.100",
    "uvicorn[standard]>=0.22",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",

    # 浏览器自动化
    "playwright>=1.40",

    # 工具
    "python-dateutil>=2.8",
    "pytz>=2023.3",
    "tqdm>=4.64",
    "pyyaml>=6.0",
    "orjson>=3.9",

    # 调度
    "schedule>=1.2",
    "apscheduler>=3.10",

    # 序列化 & 缓存
    "joblib>=1.2",
    "cachetools>=5.3",

    # 可视化 (回测/分析)
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "plotly>=5.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.5",
    "ruff>=0.1",
    "black>=23.0",
    "pre-commit>=3.3",
]
realtime = [
    "redis>=4.5",
    "kafka-python>=2.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
]

[tool.setuptools]
packages = ["pipeline", "predictors", "rules", "features", "modules", "data_collector", "backend", "database", "bookmaker_sim", "config", "data", "ml", "optimize", "validation", "training", "core", "knowledge_base", "interfaces", "agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
markers = [
    "live_data: 依赖 live odds feed (THEODDS_API_KEY)，无 feed 环境跳过",
]

# ── mypy 类型门禁 (P1-2 升级) ──
[tool.mypy]
python_version = "3.12"
mypy_path = "."
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
warn_unused_configs = true
files = ["pipeline", "scripts/bet_core.py", "data_collector", "bookmaker_sim"]

[[tool.mypy.overrides]]
module = [
    "pipeline.*",
    "data.worldcup26_enricher.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["scripts.bet_core", "pipeline.deep_report", "pipeline.reverse_odds_engine", "pipeline.score_model"]
disallow_untyped_defs = true
check_untyped_defs = true
ignore_errors = false
