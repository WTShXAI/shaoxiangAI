# =============================================================================
# 哨响AI - 容器编排 (backend + frontend + collector 三服务)
# =============================================================================
# 用法 (在仓库根目录执行):
#   cp deploy/.env.example deploy/.env   # 填入 GQ_REQUEST_ID / SECRET_KEY 等
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# 要点:
#   - backend: 由 deploy/backend.Dockerfile 构建, 跑 bridge_service.py (API + 内嵌 SPA 回退)
#   - frontend: 由 deploy/frontend.Dockerfile 构建, nginx 托管 SPA 并反代 /api /ws
#   - collector: 复用 backend 镜像, 改 command 跑 gq/auto_collector.py (前台, 由 Docker 托管 PID1)
#   - data 卷挂载 SQLite (GQ.db 8GB / football_data.db 661MB) 与 logs/reports/odds_db
#   - 日志轮转: json-file max-size 50m max-file 10 (防历史 1.2GB 膨胀)
#   - 健康检查: backend /health; frontend nginx; collector 检测 GQ.db 写新鲜度
#   - restart: unless-stopped (进程退出自动拉起)
# =============================================================================
services:

  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    image: shaoxiang-ai-backend:latest
    container_name: shaoxiang-backend
    env_file:
      - ./deploy/.env
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=9000
    ports:
      - "9000:9000"   # 直接暴露 API (调试/外部调用); 正常访问走 frontend:8080
    volumes:
      - ./data:/app/data
      - ./saved_models:/app/saved_models
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./odds_db:/app/odds_db
      - ./config:/app/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    image: shaoxiang-ai-frontend:latest
    container_name: shaoxiang-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"     # 宿主机 8080 -> 容器 80 (nginx). 如需 80 改为 "80:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  collector:
    # 复用 backend 镜像 (含 gq/ 与全部依赖), 仅替换启动命令为采集器前台运行
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    image: shaoxiang-ai-backend:latest
    container_name: shaoxiang-collector
    command: ["python", "gq/auto_collector.py", "-i", "60"]
    env_file:
      - ./deploy/.env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./odds_db:/app/odds_db
      - ./config:/app/config:ro
    restart: unless-stopped
    # 采集器唯一外部信号 = 持续写 GQ.db; 超过 10 分钟未更新视为假死
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$(find /app/data -maxdepth 1 -name 'GQ.db' -mmin -10)\" || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

networks:
  default:
    name: shaoxiang-net
    driver: bridge
