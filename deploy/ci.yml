# =============================================================================
# 哨响AI - CI/CD 工作流 (部署增强草稿)
# =============================================================================
# 本文件用于替换 .github/workflows/ci.yml (或合并)。
# 相对原 ci.yml 的改进:
#   1. build 阶段同时构建 backend + frontend 两个镜像 (deploy/*.Dockerfile)
#   2. 新增 deploy-smoke 阶段: docker compose 起三服务, 验证
#        - backend /health
#        - frontend SPA 可达
#        - collector healthcheck 通过 (GQ.db 写新鲜度)
#      验证完毕自动 teardown, 不推送镜像 (除非打 release tag 才 push)
# 触发: push / pull_request -> main
# =============================================================================

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20.x"

jobs:
  # ═══════════════════════════════════════════════
  # Lint (flake8 + mypy 类型门禁)
  # ═══════════════════════════════════════════════
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 flake8-bugbear mypy
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Lint with flake8
        run: |
          flake8 . --count --statistics --show-source \
            --max-line-length=120 \
            --ignore=E203,E266,E501,W503,F841,E402,F403,F401 \
            --exclude=.venv,.venv_314_backup,__pycache__,build,dist,.git,*.egg-info
      - name: Type check with mypy
        run: mypy

  # ═══════════════════════════════════════════════
  # Security (密钥禁入库 + 硬编码密钥扫描)
  # ═══════════════════════════════════════════════
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "ERROR: .env tracked - secrets may be leaked!"; exit 1
          fi
          if grep -rInE "(THE_ODDS_API_KEY|SECRET_KEY|ACCESS_TOKEN|api_key|secret|token)\s*[:=]\s*[\"'][A-Za-z0-9_\-]{20,}[\"']" \
               pipeline/ scripts/ bridge_service.py data_collector/ config/ \
               --include=*.py 2>/dev/null \
             | grep -vE "os\.getenv|os\.environ|getenv\(|environ\[|example|XXX|not set|changeme|your_|placeholder|TODO"; then
            echo "ERROR: possible hardcoded secret"; exit 1
          fi
          echo "OK: no tracked .env / no hardcoded secrets"

  # ═══════════════════════════════════════════════
  # Test (py_compile + import guard + pytest + SSoT 覆盖率)
  # ═══════════════════════════════════════════════
  test:
    runs-on: ubuntu-latest
    needs: [lint, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov fastapi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: py_compile full scan
        run: |
          find . -name "*.py" -not -path "./.venv/*" -not -path "./__pycache__/*" \
            -not -path "./frontend/*" -print0 | xargs -0 -I {} python -m py_compile {} \
            || (echo "ERROR: py_compile failed"; exit 1)
          echo "OK: py_compile passed"
      - name: SSoT regression guards
        run: |
          python -m pytest tests/test_import_guard.py tests/test_oos_guard.py -v --tb=short \
            || (echo "ERROR: import/oos guard failed"; exit 1)

  # ═══════════════════════════════════════════════
  # Frontend (tsc typecheck + vite build)
  # ═══════════════════════════════════════════════
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck || (echo "ERROR: tsc failed"; exit 1)
      - run: npm run build || (echo "ERROR: vite build failed"; exit 1)

  # ═══════════════════════════════════════════════
  # Build images (backend + frontend via deploy Dockerfiles)
  # ═══════════════════════════════════════════════
  build:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/backend.Dockerfile
          tags: shaoxiang-ai-backend:ci-${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/frontend.Dockerfile
          tags: shaoxiang-ai-frontend:ci-${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test backend
        run: |
          docker run -d --name be-test -p 9000:9000 shaoxiang-ai-backend:ci-${{ github.sha }}
          sleep 12
          curl -sf http://localhost:9000/health || (docker logs be-test; exit 1)
          docker stop be-test && docker rm be-test
          echo "OK: backend health passed"

  # ═══════════════════════════════════════════════
  # Deploy smoke (compose up, verify 3 services, teardown)
  # 仅在 push 到 main 或 tag 时运行; 不推送镜像到仓库 (除非后续加 push 步骤)
  # ═══════════════════════════════════════════════
  deploy-smoke:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env
        run: cp deploy/.env.example deploy/.env
      - name: Start stack
        run: docker compose -f deploy/docker-compose.yml up -d --build
      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/health; then echo "backend OK"; break; fi
            sleep 5
          done
          curl -sf http://localhost:9000/health || (docker compose -f deploy/docker-compose.yml logs; exit 1)
      - name: Verify frontend reachable
        run: curl -sf http://localhost:8080/ >/dev/null && echo "frontend OK"
      - name: Verify collector healthcheck
        run: |
          # 采集器首次写入 GQ.db 需时间; 给 90s 宽限
          for i in $(seq 1 18); do
            status=$(docker inspect -f '{{.State.Health.Status}}' shaoxiang-collector 2>/dev/null || echo "starting")
            if [ "$status" = "healthy" ]; then echo "collector OK"; break; fi
            sleep 5
          done
          docker inspect -f '{{.State.Health.Status}}' shaoxiang-collector
      - name: Teardown
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
