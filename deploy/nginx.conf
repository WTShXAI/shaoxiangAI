# =============================================================================
# 哨响AI 前端 nginx 配置
# - 托管 Vite 构建的 SPA (frontend/dist)
# - 将 /api 与 /ws 反代到后端 bridge_service (默认 backend:9000)
# - SPA history 回退: 未知路径回退 index.html (前端 React Router 接管)
# - 不缓存 index.html (保证发版即时生效)
# =============================================================================
upstream shaoxiang_backend {
    server backend:9000;
    # 若后端容器名不同, 改此处 (与 docker-compose services.backend 对齐)
}

server {
    listen 80;
    server_name _;

    # SPA 静态资源 (带内容哈希, 长缓存)
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API 反代
    location /api/ {
        proxy_pass http://shaoxiang_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 长轮询/流式接口不缓冲
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # WebSocket (滚球实时推送) 反代
    location /ws/ {
        proxy_pass http://shaoxiang_backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # 健康检查/根路径
    location = /health {
        proxy_pass http://shaoxiang_backend/health;
        proxy_set_header Host $host;
    }

    # SPA: 非文件资源回退 index.html
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        # index.html 不缓存, 保证发版即时生效
        add_header Cache-Control "no-cache";
    }
}
