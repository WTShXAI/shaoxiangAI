# 哨响AI - 专家注册配置
# ======================
# ExpertHub 启动时加载

experts:
  - expert_id: trend_analyzer
    class_path: agents.experts.trend_agent.TrendAgent
    category: trend
    phase: 1
    display_name: "趋势分析"
    tags: ["trend", "pattern"]

  - expert_id: alpha_decision
    class_path: agents.experts.alpha_agent.AlphaAgent
    category: value
    phase: 2
    display_name: "Alpha决策"
    tags: ["alpha", "value"]

  - expert_id: referee_model
    class_path: agents.experts.referee_agent.RefereeAgent
    category: risk
    phase: 2
    display_name: "裁判分析"
    tags: ["referee", "card"]

  - expert_id: upset_detector
    class_path: agents.experts.upset_agent.UpsetAgent
    category: risk
    phase: 4
    display_name: "冷门检测"
    tags: ["upset", "dark_horse"]

  - expert_id: media_intelligence
    class_path: agents.experts.media_agent.MediaAgent
    category: auxiliary
    phase: 4
    display_name: "媒体情报"
    tags: ["media", "news"]

  - expert_id: coach_tactics
    class_path: agents.experts.coach_agent.CoachAgent
    category: tactical
    phase: 2
    display_name: "教练战术"
    tags: ["coach", "formation"]

  - expert_id: quant_trader
    class_path: agents.experts.quant_agent.QuantAgent
    category: value
    phase: 2
    display_name: "量化交易"
    tags: ["quant", "kelly"]

  - expert_id: timespace_detector
    class_path: agents.experts.timespace_agent.TimeSpaceAgent
    category: temporal
    phase: 3
    display_name: "时空检测"
    tags: ["time", "schedule"]

  - expert_id: arbitrage_detector
    class_path: agents.experts.arbitrage_agent.ArbitrageAgent
    category: value
    phase: 4
    display_name: "套利检测"
    tags: ["arbitrage", "odds"]

  - expert_id: goal_timing
    class_path: agents.experts.goal_timing_agent.GoalTimingAgent
    category: temporal
    phase: 3
    display_name: "进球时序"
    tags: ["goal", "timing"]

# ═══════════════════════════════════════════
# 投注核心配置 (bet_core SSoT 消费)
# ═══════════════════════════════════════════
betting:
  bankroll: 3000.0           # 本金基准 (单位)
  frac_kelly: 0.5            # 凯利比例 (0.5 = 半凯利)
  max_stake_frac: 0.10       # 单注封顶(占本金比例)
  min_disagreement_bets: 300 # 生产环境分歧子集最低容量 (低于此值→全局NO-GO)
  env: "DEV"                 # DEV/PROD — PROD 启用 NO-GO 护栏
  # ── P0a 注码风控闸门 (2026-08-01, 针对 ROI=-30% 根因: 重注低赔热门全输) ──
  hot_odds_max: 1.5          # 低赔热门阈值: odds<此值视为市场强热门, 触发限注
  hot_frac_cap: 0.03         # 热门单注封顶(占本金): 从10%压到3%, 止"重注热门全输"
  min_spread_pp: 0.0         # 跨庄分歧放注门槛(pp): >0时跨庄spread不足则NO-BET (P1接跨庄后建议15)
  loss_cooldown_after: 0     # 连败降档触发场数: >0时连输N场后凯利缩放 (0=不启用)
  loss_frac_scale: 0.5       # 连败降档缩放: 触发后 frac *= 此值
